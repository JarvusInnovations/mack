name: Publish npm package

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        # Node 24 ships npm 11.x, which supports trusted publishing (OIDC) out of the box.
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Resolve release tag
      run: echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

    - name: Set package.json version from tag
      run: npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"

    - name: Install dependencies
      run: npm ci

    - name: Build and test
      run: npm run compile && npm test

    - name: Publish to npm
      run: npm publish --provenance --access public
